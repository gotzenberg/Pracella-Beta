<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pracella | Touch Test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#171717;font:16px -apple-system,BlinkMacSystemFont,sans-serif}header{background:#fff;padding:20px 18px 12px;border-bottom:1px solid #ddd}h1{font-family:Georgia,serif;margin:0;font-size:30px;font-weight:normal}small{color:#666}.tools{display:flex;gap:8px;flex-wrap:wrap;padding:14px 12px}.tools button{font:inherit;padding:12px 16px;border:1px solid #aaa;border-radius:10px;background:#fff;color:#111}.tools button.active{background:#171717;color:white}#status{padding:0 15px 12px;font-size:14px;color:#555}#viewport{height:58vh;overflow:auto;background:#ddd;border-top:1px solid #ccc;border-bottom:1px solid #ccc;touch-action:pan-x pan-y pinch-zoom}#sheet{position:relative;margin:16px auto;background:#fff;width:740px;height:880px;box-shadow:0 2px 8px #0002;transform-origin:top left}#score{display:block;width:100%;height:100%;pointer-events:none}#ink{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:none}#sheet.draw #ink{display:block}footer{padding:16px;font-size:13px;color:#666}
</style>
</head>
<body>
<header><h1>Pracella</h1><small>Your personal AI music coach · Touch prototype</small></header>
<div class="tools"><button id="navigate" class="active">Navigate</button><button id="draw">Draw</button><button id="test">Test ink</button><button id="undo">Undo</button><button id="clear">Clear</button></div>
<div id="status" aria-live="polite">Ready. Tap Test ink first.</div>
<div id="viewport"><div id="sheet">
<svg id="score" viewBox="0 0 740 880" xmlns="http://www.w3.org/2000/svg"><rect width="740" height="880" fill="white"/><text x="370" y="90" font-size="30" text-anchor="middle" font-family="Georgia,serif">Touch Test</text><text x="370" y="118" font-size="15" text-anchor="middle" fill="#555">Sample notation — not a published score</text>
<g stroke="#444" stroke-width="1.2"><path d="M70 195H670 M70 210H670 M70 225H670 M70 240H670 M70 255H670 M70 365H670 M70 380H670 M70 395H670 M70 410H670 M70 425H670 M70 535H670 M70 550H670 M70 565H670 M70 580H670 M70 595H670"/></g>
<g fill="#222" stroke="#222" stroke-width="2"><ellipse cx="140" cy="225" rx="9" ry="6" transform="rotate(-20 140 225)"/><path d="M149 225V177"/><ellipse cx="225" cy="210" rx="9" ry="6" transform="rotate(-20 225 210)"/><path d="M234 210V162"/><ellipse cx="310" cy="240" rx="9" ry="6" transform="rotate(-20 310 240)"/><path d="M319 240V192"/><ellipse cx="395" cy="225" rx="9" ry="6" transform="rotate(-20 395 225)"/><path d="M404 225V177"/><ellipse cx="480" cy="210" rx="9" ry="6" transform="rotate(-20 480 210)"/><path d="M489 210V162"/><ellipse cx="565" cy="240" rx="9" ry="6" transform="rotate(-20 565 240)"/><path d="M574 240V192"/></g><g fill="#777" font-size="18" font-family="Georgia,serif"><text x="70" y="325">Draw a circle around any notes above.</text><text x="70" y="485">Navigate mode lets you scroll the page.</text><text x="70" y="655">Your annotations stay separate from the score.</text></g></svg>
<svg id="ink" viewBox="0 0 740 880" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"></svg>
</div></div><footer>Test 1: Test ink should show a gray oval. Test 2: Draw, then circle notes with your finger. Test 3: Navigate, then scroll.</footer>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),sheet=$('sheet'),ink=$('ink'),status=$('status');let mode='navigate',current=null,activeId=null;const NS='http://www.w3.org/2000/svg';function say(s){status.textContent=s}function setMode(m){mode=m;sheet.classList.toggle('draw',m==='draw');$('draw').classList.toggle('active',m==='draw');$('navigate').classList.toggle('active',m==='navigate');say(m==='draw'?'Draw mode: trace a shape around notes.':'Navigate mode: scroll the score.')}function point(e){const r=ink.getBoundingClientRect();return [(e.clientX-r.left)*740/r.width,(e.clientY-r.top)*880/r.height]}function addPath(d){const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke','#555');p.setAttribute('stroke-width','5');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');ink.appendChild(p);return p}$('navigate').addEventListener('click',()=>setMode('navigate'));$('draw').addEventListener('click',()=>setMode('draw'));$('test').addEventListener('click',()=>{addPath('M 105 175 C 180 145, 370 155, 460 185 C 500 220, 470 275, 410 280 C 290 300, 140 285, 105 250 C 85 220, 90 190, 105 175 Z');sheet.classList.add('draw');ink.style.display='block';say('Test ink visible. Tap Draw to trace with your finger.')});$('clear').addEventListener('click',()=>{ink.replaceChildren();if(mode!=='draw')ink.style.display='none';say('Ink cleared.')});$('undo').addEventListener('click',()=>{ink.lastElementChild?.remove();say('Last stroke removed.')});ink.addEventListener('pointerdown',e=>{if(mode!=='draw')return;e.preventDefault();activeId=e.pointerId;ink.setPointerCapture(e.pointerId);const [x,y]=point(e);current=addPath(`M ${x} ${y} L ${x+.1} ${y+.1}`);say('Drawing…')});ink.addEventListener('pointermove',e=>{if(e.pointerId!==activeId||!current)return;e.preventDefault();const [x,y]=point(e);current.setAttribute('d',current.getAttribute('d')+` L ${x.toFixed(1)} ${y.toFixed(1)}`)});function end(e){if(e.pointerId!==activeId)return;current=null;activeId=null;say('Stroke saved. Draw another or tap Navigate.')}ink.addEventListener('pointerup',end);ink.addEventListener('pointercancel',end);})();
</script>
</body>
</html>
